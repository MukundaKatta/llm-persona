[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-persona"
version = "0.1.0"
description = "Named persona registry for LLM agents — define system prompts, apply to requests, inject into messages. Zero dependencies."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
keywords = ["llm", "agents", "persona", "system-prompt"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/MukundaKatta/llm-persona"

[tool.setuptools.packages.find]
where = ["src"]
